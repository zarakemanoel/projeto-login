<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
               <h1>Login</h1>
               <p>Seja bem vindo(a) novamente! Faça login para acessar sua conta</p>
               <form action="login.php" method="post" autocomplete="on"> 
                <div class="campo">
                    <i class="material-icons">person</i>
                 <input type="email" name="Login" id="iLogin" placeholder="Seu email" required maxlength="30" autocomplete="email">
                   <label for="iLogin">Login</label>
                </div>
                <div class="campo">
                    <i class="material-icons">vpn_key</i>
                  <input type="password" name="Senha" id="iSenha" placeholder="Sua senha" required minlength="8" maxlength="18" autocomplete="current-password">
                  <label for="iSenha">Senha</label>
                </div>
                <input type="submit" value="Logar">
                <a href="Esqueci a senha" class="botao">Esqueci a senha  <i class="material-icons">mail</i></a>
               </form>
            </div>
        </section>
    </main>
</body>
</html>
